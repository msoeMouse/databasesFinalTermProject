<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Account Settings</title>

</head>
<body>
    <header id="account-header"></header>
    <script src="header.js"></script>

    <h1>Account Settings</h1>
    <div id="settings">
        <label for="changeEmail">Input New Email</label>
        <input id="changeEmail" type="text" placeholder="abc@gmail.com">
        <button>Update Email</button>

        <label for="changePassword">Input New Password</label>
        <input id="changePassword" type="text" placeholder="Password123">
        <button>Update Password</button>

        <script src="account_settings.js"></script>
    </div>
</body>
</html>
